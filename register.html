<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Vault Heist</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body class="regPage">

    <div class="menu">
        <div class="menuLinks">
            <a class="link" href="index.html#home">HOME</a>
            <a class="link" href="index.html#about">THE VAULT</a>
            <a class="link" href="index.html#agenda">AGENDA</a>
            <a class="link" href="index.html#contact">CONTACT US</a>
        </div>
    </div>

    <div class="navBar">
        <a href="index.html"><img class="logo" src="images/harry_title.png" alt="Logo"></a>
        <div class="navLinks">
            <a class="link" href="index.html#home">HOME</a>
            <a class="link" href="index.html#about">THE VAULT</a>
            <a class="link" href="index.html#agenda">AGENDA</a>
            <a class="link" href="index.html#contact">CONTACT US</a>
        </div>
        <img class="menuIcon" src="images/menu.svg" alt="Menu Icon">
    </div>

    <main class="regWrap">
        <div class="regButton">
            BACK TO HOME
        </div>

        <div class="regLogo">

        </div>

        <div class="regCardCont">
            <img class="regCard" src="images/registration.png">
            <p class="regBlack">MEMBER'S APPLICATION</p>
            <p class="cardTitle">VAULT HEIST REGISTRATION </p>
            <div class="inputGrid">
                <input type="text" class="regInput" placeholder="Enter Your Full Name. . . .">
                <input type="text" class="regInput" placeholder="Enter Your Email Address. . . .">
                <input type="text" class="regInput" placeholder="Enter Your Phone Number. . . .">
                <input type="text" class="regInput" placeholder="Enter Your University. . . .">
            </div>

            <p class="regBlack rb2">CHOOSE YOUR ROLE</p>

            <div class="roleGrid">
                <label class="vaultCheckLabel">
                    <input type="radio" name="role" class="vaultCheckbox">
                    CRYPTOGRAPHY
                </label>
                <label class="vaultCheckLabel">
                    <input type="radio" name="role" class="vaultCheckbox">
                    UI/UX DESIGN
                </label>
                <label class="vaultCheckLabel">
                    <input type="radio" name="role" class="vaultCheckbox">
                    DEVELOPMENT
                </label>
                <label class="vaultCheckLabel">
                    <input type="radio" name="role" class="vaultCheckbox">
                    CYBER-DEFENCE
                </label>
                <label class="vaultCheckLabel">
                    <input type="radio" name="role" class="vaultCheckbox">
                    CYBER-ATTACK
                </label>
            </div>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
